name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedding-extra:
    name: embedding extra (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra embedding --dev
      - run: uv run python -c "import sentence_transformers, sqlite_vec"
      - run: |
          uv run pytest \
            tests/embeddings/test_contracts.py \
            tests/packaging/test_embedding_extra.py \
            tests/vector \
            tests/adapters/test_exact_cosine_projection.py \
            tests/adapters/test_sqlite_vec_projection.py \
            tests/evaluation/test_dense_compatibility.py \
            tests/evaluation/test_dense_candidate.py \
            tests/evaluation/test_dense_threshold.py \
            tests/evaluation/test_dense_comparison.py \
            tests/evaluation/test_dense_artifact.py \
            tests/evaluation/test_dense_replay.py \
            tests/evaluation/test_dense_documentation.py \
            tests/scripts/test_dense_retrieval_deployment_proof.py \
            tests/scripts/test_dense_retrieval_measurement.py \
            -q
      - name: Validate dense compatibility artifact without model cache
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from mke.evaluation.dense_compatibility import (
              load_dense_corpus_lock,
              validate_dense_compatibility_report,
          )
          root = Path(".").resolve()
          lock = load_dense_corpus_lock(
              Path("tests/fixtures/retrieval-dense-v1/corpus-lock.json"),
              repository_root=root,
          )
          report = json.loads(
              Path("benchmarks/retrieval/qwen3-embedding-0.6b-compatibility.json").read_text()
          )
          validate_dense_compatibility_report(report, lock)
          assert report["compatibility_status"] == "passed"
          assert report["projection"]["selected_adapter"] == "exact-cosine-v1"
          PY

  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: Run full test suite with live diagnostics
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: >-
          uv run pytest -vv --tb=short
          --durations=50 --durations-min=1.0
          -o faulthandler_timeout=120
          -o faulthandler_exit_on_timeout=true
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Run retrieval evaluation baseline
        run: |
          uv run mke eval retrieval \
            --manifest tests/fixtures/retrieval-eval-v1.json \
            --json > /tmp/mke-retrieval-eval.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/mke-retrieval-eval.json"))
          assert payload["status"] == "passed"
          assert payload["quality_status"] == "baseline_recorded"
          assert payload["documents"] == 3
          assert payload["queries"] == 24
          assert payload["answerable"] == 16
          assert payload["unanswerable"] == 8
          assert payload["integrity_failures"] == []
          print(json.dumps(payload["metrics"], sort_keys=True))
          PY
          uv run python -m mke.evaluation.baseline \
            --artifact benchmarks/retrieval/retrieval-eval-v1-baseline.json \
            --manifest tests/fixtures/retrieval-eval-v1.json \
            --repository . \
            --main-ref origin/main
      - name: Reject archived numeric lock and validate current retrieval-order compatibility
        run: |
          TEMPORARY_COMPATIBILITY_JSON="$RUNNER_TEMP/retrieval-order-v2-compatibility-${{ matrix.python-version }}.json"
          COMPATIBILITY_RECORD_RESULT="$RUNNER_TEMP/retrieval-order-v2-record-${{ matrix.python-version }}.json"
          COMPATIBILITY_VALIDATE_RESULT="$RUNNER_TEMP/retrieval-order-v2-validate-${{ matrix.python-version }}.json"
          CANONICAL_STATE_JSON="$RUNNER_TEMP/retrieval-order-canonical-state-${{ matrix.python-version }}.json"
          NUMERIC_COMPARISON_JSON="$RUNNER_TEMP/numeric-comparison-${{ matrix.python-version }}.json"
          export TEMPORARY_COMPATIBILITY_JSON COMPATIBILITY_RECORD_RESULT
          export COMPATIBILITY_VALIDATE_RESULT CANONICAL_STATE_JSON NUMERIC_COMPARISON_JSON
          test ! -e "$TEMPORARY_COMPATIBILITY_JSON"
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          canonical_paths = (
              "benchmarks/retrieval/retrieval-order-v1-development-freeze.json",
              "benchmarks/retrieval/retrieval-order-v1-holdout-receipt.json",
              "benchmarks/retrieval/retrieval-order-v1-artifact.json",
              "benchmarks/retrieval/retrieval-order-v2-compatibility-attempt.json",
              "benchmarks/retrieval/retrieval-order-v2-compatibility.json",
          )

          def state() -> dict[str, str | None]:
              return {
                  path: (
                      hashlib.sha256(Path(path).read_bytes()).hexdigest()
                      if Path(path).exists()
                      else None
                  )
                  for path in canonical_paths
              }

          canonical_state_before = state()
          assert all(value is None for value in canonical_state_before.values())
          Path(os.environ["CANONICAL_STATE_JSON"]).write_text(
              json.dumps(canonical_state_before, sort_keys=True),
              encoding="utf-8",
          )
          PY
          set +e
          uv run mke eval retrieval-numeric \
            --protocol tests/fixtures/retrieval-numeric-v1/protocol-lock.json \
            --json > "$NUMERIC_COMPARISON_JSON"
          comparison_status=$?
          set -e
          test "$comparison_status" -eq 1
          uv run python - <<'PY'
          import json
          import os

          with open(os.environ["NUMERIC_COMPARISON_JSON"], encoding="utf-8") as stream:
              p = json.load(stream)
          assert p["integrity_status"] == "failed"
          assert p["candidate_status"] == "not_recorded"
          assert len(p["integrity_failures"]) == 1
          f = p["integrity_failures"][0]
          assert f["problem"] == "retrieval_numeric_fixture_invalid"
          assert f["cause"] == "protocol-bound input identity mismatch"
          assert f["next_step"] == "restore_numeric_protocol_inputs"
          assert f["subject_id"] is None
          PY
          uv run python -m mke.evaluation.retrieval_order_compatibility record \
            --protocol tests/fixtures/retrieval-order-v1/protocol.json \
            --artifact "$TEMPORARY_COMPATIBILITY_JSON" \
            --repository . --json > "$COMPATIBILITY_RECORD_RESULT"
          uv run python -m mke.evaluation.retrieval_order_compatibility validate \
            --protocol tests/fixtures/retrieval-order-v1/protocol.json \
            --artifact "$TEMPORARY_COMPATIBILITY_JSON" \
            --repository . --json > "$COMPATIBILITY_VALIDATE_RESULT"
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def load(name: str) -> dict[str, object]:
              with open(os.environ[name], encoding="utf-8") as stream:
                  value = json.load(stream)
              assert isinstance(value, dict)
              return value

          def state(paths: object) -> dict[str, str | None]:
              assert isinstance(paths, dict)
              return {
                  path: (
                      hashlib.sha256(Path(path).read_bytes()).hexdigest()
                      if Path(path).exists()
                      else None
                  )
                  for path in paths
              }

          record = load("COMPATIBILITY_RECORD_RESULT")
          validate = load("COMPATIBILITY_VALIDATE_RESULT")
          artifact = load("TEMPORARY_COMPATIBILITY_JSON")
          assert record == {
              "schema_version": "mke.retrieval_order_compatibility_record_result.v1",
              "status": "passed",
              "mode": "record",
              "authority_layer": "archive_current_differential",
              "canonical": False,
              "output_state": "complete_visible",
              "publication_outcome": "published",
              "problem": "none",
              "cause": "none",
              "next_step": "none",
              "first_failed_gate": "none",
              "stage_statuses": [{"name": "compatibility", "status": "passed"}],
              "historical_revision": 1,
              "current_revision": 2,
          }
          assert validate == {
              "schema_version": "mke.retrieval_order_compatibility_validate_result.v1",
              "status": "passed",
              "mode": "validate",
              "authority_layer": "artifact_validation",
              "canonical": False,
              "output_state": "complete_preexisting",
              "publication_outcome": "not_attempted",
              "problem": "none",
              "cause": "none",
              "next_step": "none",
              "first_failed_gate": "none",
              "stage_statuses": [{"name": "compatibility", "status": "passed"}],
              "historical_revision": 1,
              "current_revision": 2,
          }
          assert artifact["integrity_status"] == "passed"
          assert artifact["compatibility_status"] == "passed"
          families = artifact["families"]
          assert isinstance(families, list)
          assert len(families) == 7
          assert [family["family"] for family in families] == [
              "e1_baseline",
              "e2_numeric",
              "e3a_chinese",
              "e3b_cjk_lexical",
              "e3c_dense",
              "e3d_hybrid_rrf",
              "e3e_relevance_gate",
          ]
          differential_fields = (
              "membership_delta",
              "score_hex_delta",
              "non_tied_pair_delta",
              "metric_delta",
              "gate_delta",
              "verdict_delta",
          )
          assert all(
              family[field] == 0
              for family in families
              for field in differential_fields
          )
          assert artifact["limitations"] == [
              "historical_compatibility_only",
              "tie_permutation_only",
              "no_relevance_improvement_claim",
              "no_runtime_promotion",
              "public_holdout_not_observed",
          ]
          assert artifact["historical_capability"]["status"] in {
              "deterministic_historical_subprocess_replay",
              "no_ordered_delta_authority",
          }
          canonical_state_before = json.loads(
              Path(os.environ["CANONICAL_STATE_JSON"]).read_text(encoding="utf-8")
          )
          canonical_state_after = state(canonical_state_before)
          assert canonical_state_before == canonical_state_after
          assert all(value is None for value in canonical_state_before.values())
          assert all(value is None for value in canonical_state_after.values())
          PY
      - name: Run Chinese retrieval baseline
        run: |
          uv run mke eval retrieval-chinese \
            --protocol tests/fixtures/retrieval-chinese-v1/protocol.json \
            --json > /tmp/mke-retrieval-chinese.json
          uv run python -m mke.evaluation.chinese_artifact validate \
            --artifact benchmarks/retrieval/retrieval-chinese-v1-baseline.json \
            --observed /tmp/mke-retrieval-chinese.json \
            --protocol tests/fixtures/retrieval-chinese-v1/protocol.json \
            --repository .
      - name: Validate CJK lexical comparison candidate
        run: |
          uv run mke eval retrieval-cjk-lexical \
            --protocol tests/fixtures/retrieval-chinese-v1/protocol.json \
            --candidate cjk-trigram-overlap-v1 \
            --json > /tmp/mke-cjk-lexical-comparison.json
          uv run python -m mke.evaluation.cjk_lexical_artifact validate \
            --artifact benchmarks/retrieval/cjk-trigram-overlap-v1-comparison.json \
            --observed /tmp/mke-cjk-lexical-comparison.json \
            --protocol tests/fixtures/retrieval-chinese-v1/protocol.json \
            --repository .
      - name: Validate dense comparison artifact model-free
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          uv run python scripts/dense_retrieval_measurement.py \
            --repository . \
            --protocol tests/fixtures/retrieval-dense-v1/protocol-lock.json \
            --artifact benchmarks/retrieval/qwen3-embedding-0.6b-exact-v1-comparison.json \
            --model-free
      - run: uv build
      - name: Verify model-free media contracts with transcription extra
        env:
          HF_HUB_OFFLINE: "1"
          MKE_REQUIRE_TRANSCRIPTION_EXTRA: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          uv sync --locked --extra transcription
          uv run pytest \
            tests/adapters/test_spoken_video_fixture.py \
            tests/adapters/test_audio_fixtures.py \
            tests/adapters/test_faster_whisper_audio_cli.py \
            tests/proof/test_direct_audio.py::test_direct_audio_proof_covers_all_formats_and_product_path \
            tests/scripts/test_direct_audio_dependency_receipt.py::test_validate_receipt_cli_accepts_committed_artifact_without_runtime_replay \
            -q
          UV_OFFLINE=1 uv run mke proof direct-audio --json \
            > /tmp/mke-direct-audio-proof.json
          python -c 'import json; p=json.load(open("/tmp/mke-direct-audio-proof.json")); assert p["status"] == "passed"; assert p["network_access"] == "not_used"; assert p["proof_mode"] == "model_free"; assert p["asr_execution"] == "not_performed"'
      - run: |
          uv venv /tmp/mke-wheel-env --python "${{ matrix.python-version }}"
          uv pip install --python /tmp/mke-wheel-env/bin/python dist/*.whl
          /tmp/mke-wheel-env/bin/mke
          /tmp/mke-wheel-env/bin/mke demo --verify
          (
            cd "$RUNNER_TEMP"
            /tmp/mke-wheel-env/bin/mke eval retrieval \
              --manifest "$GITHUB_WORKSPACE/tests/fixtures/retrieval-eval-v1.json" \
              --json > /tmp/mke-wheel-retrieval-eval.json
            /tmp/mke-wheel-env/bin/mke eval retrieval-cjk-lexical \
              --protocol "$GITHUB_WORKSPACE/tests/fixtures/retrieval-chinese-v1/protocol.json" \
              --candidate cjk-trigram-overlap-v1 \
              --json > /tmp/mke-wheel-cjk-lexical-comparison.json
            /tmp/mke-wheel-env/bin/python -m mke.evaluation.cjk_lexical_artifact validate \
              --artifact "$GITHUB_WORKSPACE/benchmarks/retrieval/cjk-trigram-overlap-v1-comparison.json" \
              --observed /tmp/mke-wheel-cjk-lexical-comparison.json \
              --protocol "$GITHUB_WORKSPACE/tests/fixtures/retrieval-chinese-v1/protocol.json" \
              --repository "$GITHUB_WORKSPACE"
          )
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/mke-wheel-retrieval-eval.json"))
          assert payload["status"] == "passed"
          assert payload["quality_status"] == "baseline_recorded"
          assert payload["queries"] == 24
          cjk = json.load(open("/tmp/mke-wheel-cjk-lexical-comparison.json"))
          assert cjk["integrity_status"] == "passed"
          assert cjk["candidate_status"] == "passed"
          assert cjk["projection"]["tokenizer"] == "trigram"
          PY
      - name: Measure Chinese retrieval delivery
        run: |
          wheel=$(echo dist/*.whl)
          uv run python scripts/chinese_retrieval_measurement.py \
            --repository "$GITHUB_WORKSPACE" \
            --protocol "$GITHUB_WORKSPACE/tests/fixtures/retrieval-chinese-v1/protocol.json" \
            --wheel "$wheel" \
            --python "${{ matrix.python-version }}" \
            --installed-environment /tmp/mke-wheel-env \
            > /tmp/mke-chinese-measurement.json
          python -c 'import json; p=json.load(open("/tmp/mke-chinese-measurement.json")); assert p["status"] == "passed"; print("```json"); print(json.dumps(p, indent=2, sort_keys=True)); print("```")' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Verify transcription wheel extra without a model
        run: |
          uv export --locked --extra transcription --no-dev --no-emit-project \
            --output-file /tmp/mke-transcription-constraints.txt
          uv venv --clear /tmp/mke-wheel-env --python "${{ matrix.python-version }}"
          wheel=$(echo dist/*.whl)
          uv pip install --python /tmp/mke-wheel-env/bin/python \
            --constraint /tmp/mke-transcription-constraints.txt \
            "${wheel}[transcription]"
          uv pip check --python /tmp/mke-wheel-env/bin/python
          /tmp/mke-wheel-env/bin/python -c "import av, faster_whisper"
          set +e
          doctor_output=$(HF_HUB_OFFLINE=1 \
            /tmp/mke-wheel-env/bin/mke transcription doctor \
            --model-cache "$RUNNER_TEMP/mke-empty-model-cache" \
            --json)
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 1
          python -c 'import json,sys; payload=json.loads(sys.argv[1]); assert payload["status"] == "not_ready"' "$doctor_output"
          test ! -d .cache/huggingface
          test ! -d models
